name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RWR-Prometheus
        uses: actions/checkout@v5
      - name: Check out API contract
        uses: actions/checkout@v5
        with:
          repository: TamaWish/RWR-API
          ref: main
          path: .api-contract
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install API contract
        run: mvn --batch-mode --no-transfer-progress -f .api-contract/pom.xml clean install
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: RWR-Prometheus-${{ github.sha }}
          path: |
            target/RWR-Prometheus-*.jar
            target/RWR-Prometheus-*-dist.zip
          if-no-files-found: error
